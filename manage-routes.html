<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Routes | SmartTransit AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body data-page="manage-routes">
<div id="topbar"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="content">
<div class="d-flex justify-content-between align-items-center mb-4"><div class="mb-4"><h3 class="page-title">Route Management</h3><div class="text-muted">Add, update and remove routes and their stops</div></div><button class="btn btn-primary" id="addBtn"><i class="bi bi-plus-lg me-1"></i>Add Route</button></div>
<div class="card"><div class="card-header d-flex flex-wrap gap-2 justify-content-between"><span>All Routes</span><input class="form-control form-control-sm w-auto" id="searchBox" placeholder="Search..."></div>
<div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>No.</th><th>Name</th><th>Type</th><th>From - To</th><th>Distance</th><th>Time</th><th>Fare</th><th>Stops</th><th>Vehicles</th><th></th></tr></thead><tbody id="tableBody"></tbody></table></div></div>
<div class="modal fade" id="formModal" tabindex="-1"><div class="modal-dialog modal-lg"><form class="modal-content" id="routeForm">
  <div class="modal-header"><h5 class="modal-title" id="modalTitle">Add Route</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><div id="modalAlert"></div><input type="hidden" id="rId">
    <div class="row g-2"><div class="col-md-3"><label class="form-label small">Route no. *</label><input class="form-control" id="rNumber" required></div>
    <div class="col-md-6"><label class="form-label small">Name</label><input class="form-control" id="rName" placeholder="Auto-filled from stops"></div>
    <div class="col-md-3"><label class="form-label small">Type</label><select class="form-select" id="rType"><option>Bus</option><option>Express Bus</option><option>AC Bus</option><option>Train</option></select></div>
    <div class="col-md-3"><label class="form-label small">Fare per km (Rs)</label><input type="number" step="0.1" class="form-control" id="rFare" value="1.2"></div>
    <div class="col-md-3"><label class="form-label small">Avg speed (km/h)</label><input type="number" class="form-control" id="rSpeed" value="40"></div>
    <div class="col-md-2"><label class="form-label small">Every (min)</label><input type="number" class="form-control" id="rFreq" value="20"></div>
    <div class="col-md-2"><label class="form-label small">Passengers/day</label><input type="number" class="form-control" id="rPax" value="1000"></div>
    <div class="col-md-2"><label class="form-label small">Past delay (min)</label><input type="number" step="0.1" class="form-control" id="rDelay" value="4"></div>
    <div class="col-12"><label class="form-label small">Stops * (one per line: <code>Name, latitude, longitude</code>) - distance, time and fare are calculated automatically</label>
    <textarea class="form-control font-monospace" id="rStops" rows="6" placeholder="Karur Bus Stand, 10.9601, 78.0766&#10;Namakkal, 11.2189, 78.1677"></textarea></div></div></div>
  <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save</button></div>
</form></div></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
