<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | SmartTransit AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body data-page="login">

<div class="auth-wrap"><div class="card auth-card p-4 p-md-5">
  <div class="text-center mb-4"><div class="feature-icon mx-auto mb-3"><i class="bi bi-bus-front-fill"></i></div><h4 class="mb-1">Welcome back</h4><div class="text-muted">Sign in to SmartTransit AI</div></div>
  <div id="formAlert"></div>
  <form id="loginForm" novalidate>
    <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" name="email" required autofocus></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label><input type="password" class="form-control" id="password" name="password" required></div>
    <button class="btn btn-primary w-100 py-2" type="submit">Login</button>
  </form>
  <div class="text-center mt-3 small">New here? <a href="register.html">Create an account</a> &middot; <a href="index.html">Home</a></div>
  <div class="alert alert-light border mt-3 small mb-0"><b>Demo:</b> admin@transport.com / Admin@123<br>User: arun@example.com / User@123</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
