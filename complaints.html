<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complaints | SmartTransit AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body data-page="complaints">
<div id="topbar"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="content">
<div class="mb-4"><h3 class="page-title">Complaints</h3><div class="text-muted">Report issues and track their resolution</div></div>
<div class="row g-4">
  <div class="col-xl-4" id="formCol"><div class="card"><div class="card-header"><i class="bi bi-pencil-square me-2"></i>Register a Complaint</div><div class="card-body">
    <div id="formAlert"></div>
    <form id="complaintForm">
      <div class="mb-2"><label class="form-label small" for="title">Title *</label><input class="form-control" id="title" maxlength="200" required></div>
      <div class="mb-2"><label class="form-label small" for="description">Description *</label><textarea class="form-control" id="description" rows="4" required></textarea></div>
      <div class="d-flex align-items-center gap-2 mb-2"><button type="button" class="btn btn-sm btn-outline-info" id="analyzeBtn"><i class="bi bi-stars me-1"></i>AI Analyse</button><span class="small" id="aiResult"></span></div>
      <div class="row g-2 mb-2"><div class="col-6"><label class="form-label small" for="category">Category</label><select class="form-select" id="category"></select></div>
      <div class="col-6"><label class="form-label small" for="priority">Priority</label><select class="form-select" id="priority"></select></div></div>
      <div class="row g-2 mb-2"><div class="col-6"><label class="form-label small" for="vehicle_number">Vehicle no.</label><input class="form-control" id="vehicle_number" placeholder="TN47N1101"></div>
      <div class="col-6"><label class="form-label small" for="route_number">Route no.</label><input class="form-control" id="route_number" placeholder="101"></div></div>
      <div class="mb-3"><label class="form-label small" for="location">Location</label><input class="form-control" id="location" placeholder="Bus stand / area"></div>
      <button class="btn btn-primary w-100" id="submitBtn">Submit Complaint</button>
    </form></div></div></div>
  <div class="col-xl-8" id="listCol"><div class="card"><div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center"><span id="listTitle">My Complaints</span>
    <div class="d-flex gap-2"><select class="form-select form-select-sm" id="filterStatus"><option value="">All statuses</option></select><select class="form-select form-select-sm" id="filterCategory"><option value="">All categories</option></select></div></div>
    <div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Ref</th><th>Title</th><th class="admin-only d-none">User</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned</th><th>Date</th><th></th></tr></thead><tbody id="complaintBody"></tbody></table></div></div></div>
</div>
<div class="modal fade" id="complaintModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="modalTitle">Complaint</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><div id="modalAlert"></div><div id="modalBody"></div>
    <div id="adminControls" class="d-none border-top mt-3 pt-3"><h6>Admin actions</h6><div class="row g-2">
      <div class="col-md-4"><label class="form-label small">Assign to</label><select class="form-select" id="assignTeam"><option value="">- not changed -</option></select></div>
      <div class="col-md-4"><label class="form-label small">Status</label><select class="form-select" id="assignStatus"></select></div>
      <div class="col-md-4"><label class="form-label small">Priority</label><select class="form-select" id="assignPriority"></select></div>
      <div class="col-12"><label class="form-label small">Resolution notes</label><textarea class="form-control" id="assignNotes" rows="2"></textarea></div></div></div></div>
  <div class="modal-footer"><button class="btn btn-outline-danger me-auto d-none" id="deleteBtn"><i class="bi bi-trash"></i> Delete</button><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button class="btn btn-primary d-none" id="saveAdminBtn">Save changes</button></div>
</div></div></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/complaints.js"></script>
</body>
</html>
