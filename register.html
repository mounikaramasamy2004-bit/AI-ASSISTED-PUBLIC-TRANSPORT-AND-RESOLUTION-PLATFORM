<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | SmartTransit AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body data-page="register">

<div class="auth-wrap"><div class="card auth-card wide p-4 p-md-5">
  <div class="text-center mb-4"><h4 class="mb-1">Create your account</h4><div class="text-muted">Join SmartTransit AI</div></div>
  <div id="formAlert"></div>
  <form id="registerForm" novalidate>
    <div class="mb-3"><label class="form-label" for="full_name">Full Name</label><input class="form-control" id="full_name" name="full_name" required></div>
    <div class="row g-3 mb-3">
      <div class="col-md-7"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" name="email" required></div>
      <div class="col-md-5"><label class="form-label" for="phone">Phone</label><input class="form-control" id="phone" name="phone" placeholder="10-digit mobile" maxlength="12" required></div>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-md-6"><label class="form-label" for="password">Password</label><input type="password" class="form-control" id="password" name="password" required><div class="form-text">Min 8 characters, letters and numbers.</div></div>
      <div class="col-md-6"><label class="form-label" for="confirm">Confirm Password</label><input type="password" class="form-control" id="confirm" name="confirm" required></div>
    </div>
    <div class="mb-3"><label class="form-label" for="role">Role</label>
      <select class="form-select" id="role" name="role"><option value="USER">Commuter / User</option><option value="ADMIN">Admin</option></select></div>
    <div class="mb-3 d-none" id="adminCodeBox"><label class="form-label" for="admin_code">Admin registration code</label><input class="form-control" id="admin_code" name="admin_code" placeholder="Provided by the system owner"><div class="form-text">Default demo code: ADMIN-2026</div></div>
    <button class="btn btn-primary w-100 py-2" type="submit">Register</button>
  </form>
  <div class="text-center mt-3 small">Already registered? <a href="login.html">Login</a></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
