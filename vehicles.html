<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicles | SmartTransit AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body data-page="vehicles">
<div id="topbar"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="content">
<div class="d-flex justify-content-between align-items-center mb-4"><div class="mb-4"><h3 class="page-title">Vehicle Management</h3><div class="text-muted">Add, update and remove buses and trains</div></div><button class="btn btn-primary" id="addBtn"><i class="bi bi-plus-lg me-1"></i>Add Vehicle</button></div>
<div class="card"><div class="card-header d-flex flex-wrap gap-2 justify-content-between"><span>All Vehicles</span><input class="form-control form-control-sm w-auto" id="searchBox" placeholder="Search..."></div>
<div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>Vehicle No.</th><th>Type</th><th>Route</th><th>Driver</th><th>Capacity</th><th>Speed</th><th>Status</th><th></th></tr></thead><tbody id="tableBody"></tbody></table></div></div>
<div class="modal fade" id="formModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="vehicleForm">
  <div class="modal-header"><h5 class="modal-title" id="modalTitle">Add Vehicle</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><div id="modalAlert"></div><input type="hidden" id="vId">
    <div class="row g-2"><div class="col-md-6"><label class="form-label small">Vehicle number *</label><input class="form-control" id="vNumber" required></div>
    <div class="col-md-6"><label class="form-label small">Type</label><select class="form-select" id="vType"><option>Bus</option><option>Express Bus</option><option>AC Bus</option><option>Train</option></select></div>
    <div class="col-md-6"><label class="form-label small">Route</label><select class="form-select" id="vRoute"></select></div>
    <div class="col-md-6"><label class="form-label small">Driver</label><input class="form-control" id="vDriver"></div>
    <div class="col-md-4"><label class="form-label small">Capacity</label><input type="number" min="1" class="form-control" id="vCapacity" value="50"></div>
    <div class="col-md-4"><label class="form-label small">Speed (km/h)</label><input type="number" min="0" class="form-control" id="vSpeed" value="35"></div>
    <div class="col-md-4"><label class="form-label small">Status</label><select class="form-select" id="vStatus"><option>Active</option><option>Delayed</option><option>Idle</option><option>Maintenance</option></select></div></div></div>
  <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save</button></div>
</form></div></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
